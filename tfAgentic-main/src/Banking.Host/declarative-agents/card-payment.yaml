kind: Workflow
name: card-payment
displayName: Kredi Kartı Borç Ödeme
description: Kredi kartı borcunun banka hesabından ödenmesi.
mkCode: CreditCardPayment
instructions: |
  Kullanıcının hangi kartın borcunu, ne kadar ve hangi hesaptan ödeyeceğini netleştir.
  Kart ve hesap kimliklerini kullanıcıya sorma; araçlarla listeyi getir, kullanıcıdan
  seçim iste ve seçtiği kaydın kimliğini yaz.
outputSchema:
  type: object
  properties:
    cardId:
      type: string
      required: true
      description: >-
        Borcu ödenecek kredi kartının kimliği. list_cards aracından gelir;
        kullanıcıdan asla ham kart numarası istenmez.
    amount:
      type: number
      required: true
      description: >-
        Ödenecek tutar, Türk Lirası cinsinden sayı olarak. Kullanıcının açıkça söylediği
        rakamdır; borç tutarından veya bakiyeden türetilmez.
    sourceAccountId:
      type: string
      required: true
      description: Ödemenin çekileceği banka hesabının kimliği. list_accounts aracından gelir.
action:
  method: PUT
  path: /api/card-payment
