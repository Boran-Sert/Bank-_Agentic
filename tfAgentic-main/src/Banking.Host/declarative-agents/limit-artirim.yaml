kind: Prompt
name: limit-artirim
displayName: Kredi Kartı Limit Artırım Akışı
description: Kullanıcının kredi kartı limitini artırma taleplerini ve gerekli tutar bilgilerini toplar.
instructions: |
  Bu akış sadece kredi kartı limiti arttırımı için kullanılacaktır .Kullanıcının hangi kartının limitini, 
  hangi tutara çıkarmak istediğini netleştir.
  Kart kimliğini kullanıcıya sorma; kart uzmanına danışarak bul, kullanıcı tarif ettiyse
  doğrudan eşle, tarif etmediyse seçenekleri sun.
model:
  options:
    temperature: 0.1
inputSchema:
  type: object
  properties:
    cardId:
      type: string
      description: >-
        Limit artırımı yapılacak kartın kimliği. Kart uzmanından gelir; kart numarası
        veya son haneler bu alana yazılmaz.
    requestedLimit:
      type: number
      description: >-
        Talep edilen yeni kart limiti, sayı olarak. Kullanıcı rakamı söyleyebilir ya da
        mevcut limite göre tarif edebilir; tarif edildiyse güncel limiti kart uzmanından
        öğrenip yaz.
  required:
    - cardId
    - requestedLimit
